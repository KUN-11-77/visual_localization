name: baseline_b_netvlad_superpoint_superglue
description: "NetVLAD + SuperPoint + SuperGlue"

retrieval:
  method: NetVLADRetrieval
  top_k: 10
  params:
    pca_dim: 4096
    device: cuda

detector:
  method: SuperPointDetector
  params:
    max_keypoints: 2048
    device: cuda

matcher:
  method: SuperGlueMatcher
  params:
    confidence_threshold: 0.2
    device: cuda

dataset:
  name: cambridge
  scene: KingsCollege
  root: data/cambridge/KingsCollege
  nvm_model: reconstruction.nvm
  # NVM reconstruction resolution (if NVM was exported from COLMAP 1024px model)
  # nvm_width: 1024
  # nvm_height: 576
  query_list: dataset_test.txt
  db_list: dataset_train.txt
  fx: 1670
  fy: 1670
  cx: 960
  cy: 540

pose_solver:
  method: pnp_ransac
  ransac_thresh: 12.0
  min_inliers: 12
  confidence: 0.9999

output:
  results_dir: outputs/results/baseline_b
  save_retrieved: true
  timing: true
