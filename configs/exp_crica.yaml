name: exp_crica_cricavpr_aliked_lightglue
description: "CricaVPR + ALIKED + LightGlue — ViT检索对比（加分项）"

retrieval:
  method: CricaVPRRetrieval
  top_k: 10
  params:
    backbone: dinov2_vitb14
    weights_path: weights/CricaVPR.pth
    dinov2_weights: weights/dinov2_vitb14_pretrain.pth
    device: cuda

detector:
  method: ALIKEDDetector
  params:
    max_keypoints: 5000
    device: cuda

matcher:
  method: LightGlueMatcher
  params:
    features: aliked
    depth_confidence: 0.95
    width_confidence: 0.99
    filter_threshold: 0.1
    device: cuda

dataset:
  name: cambridge
  scene: KingsCollege
  root: data/cambridge/KingsCollege
  nvm_model: reconstruction.nvm
  query_list: dataset_test.txt
  db_list: dataset_train.txt
  fx: 1670
  fy: 1670
  cx: 960
  cy: 540

pose_solver:
  method: pnp_ransac
  ransac_thresh: 12.0
  min_inliers: 12
  confidence: 0.9999

output:
  results_dir: outputs/results/exp_crica
  save_retrieved: true
  timing: true
