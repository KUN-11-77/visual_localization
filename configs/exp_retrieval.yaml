name: exp_r_eigenplaces_superpoint_superglue
description: "EigenPlaces + SuperPoint + SuperGlue — 隔离检索模块增益"

retrieval:
  method: EigenPlacesRetrieval
  top_k: 10
  params:
    backbone: ResNet50
    device: cuda

detector:
  method: SuperPointDetector
  params:
    max_keypoints: 4096
    device: cuda

matcher:
  method: SuperGlueMatcher
  params:
    weights: outdoor
    confidence_threshold: 0.2
    device: cuda

dataset:
  name: cambridge
  scene: KingsCollege
  root: data/cambridge/KingsCollege
  nvm_model: reconstruction.nvm
  query_list: dataset_test.txt
  db_list: dataset_train.txt
  fx: 1670
  fy: 1670
  cx: 960
  cy: 540

pose_solver:
  method: pnp_ransac
  ransac_thresh: 12.0
  min_inliers: 12
  confidence: 0.9999

output:
  results_dir: outputs/results/exp_retrieval
  save_retrieved: true
  timing: true
